    <path d="M62 194C69 155 77 118 89 101C101 83 129 77 155 89C181 101 196 109 197 136C196 170 205 188 226 204"/>
    <path d="M195 120C175 123 153 128 142 142C134 152 137 160 148 163C172 169 190 162 207 184"/>
