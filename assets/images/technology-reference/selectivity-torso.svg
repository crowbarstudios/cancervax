    <text x="295" y="253">Tumor</text>
  </g>
  <g font-family="Public Sans,Arial,sans-serif" font-size="11.2" fill="#3d5964">
    <text x="151" y="233" text-anchor="middle">Designed to limit<tspan x="151" dy="13">LNP buildup</tspan></text>
    <text x="273" y="271">Intended activity</text>
