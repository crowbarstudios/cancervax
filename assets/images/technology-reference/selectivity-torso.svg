    <linearGradient id="body" x2="0" y2="1">
      <stop stop-color="#b8dcea" stop-opacity=".63"/><stop offset="1" stop-color="#dceef5" stop-opacity=".6"/>
    </linearGradient>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="m1 1 4.5 2.5L1 6" fill="none" stroke="#107986" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="particle">
      <circle r="4.6" fill="#c3e7eb" stroke="#0e7280" stroke-width="1.1"/>
      <path d="M0-5v-2.6m5 2.6 2-1.4m-12 5L-7 0" fill="none" stroke="#0e7280" stroke-width="1" stroke-linecap="round"/>
    </g>
    <g id="signal"><path d="M0 4v-4" stroke="#ad6b26" stroke-width="1"/><circle cy="-1.5" r="2.4" fill="#f1b45f" stroke="#ad6b26" stroke-width=".8"/></g>
  </defs>
  <path d="M156 16v19c0 8-7 13-17 16l-40 12c-20 6-32 21-37 42L35 230h33l27-90 7 43c4 20 0 46-9 79l-9 30h194l-9-30c-9-33-13-59-9-79l7-43 27 90h33l-27-125c-5-21-17-36-37-42l-40-12c-10-3-17-8-17-16V16" fill="url(#body)" stroke="#73a7bd" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
