<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 318">
  <title>Conceptual nanoparticle delivery in a translucent torso</title>
  <desc>An arm IV introduces nanoparticles into the bloodstream. One illustrated route leads to a tumor outside the liver. A second passes through the liver and rejoins circulation toward the tumor, showing that some nanoparticles can remain in the bloodstream rather than accumulate in the liver.</desc>
